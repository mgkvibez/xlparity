[project]
name = "xlparity"
version = "0.0.1"
description = "Excel parity, not Excel-ish: full function set plus round-trip fidelity, measured by a public scoreboard"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Pinned in-repo so lint means the same thing on every machine, instead of inheriting a parent directory's config.
[tool.ruff]
target-version = "py39"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A fresh checkout runs the documented command verbatim. Without this, `pytest` fails
# collection with ModuleNotFoundError and the repo reads as broken when it is not.
pythonpath = ["src"]
